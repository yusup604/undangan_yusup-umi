        const KEY_BRANGKAS_LOKAL = "secure_vault_pin";

        // Memeriksa brankas PIN privat di memori internal HP saat halaman dimuat
        window.onload = function() {
            const pinTersimpan = localStorage.getItem(KEY_BRANGKAS_LOKAL);
            if (pinTersimpan) {
                const sukses = eksekusiDekripsi(pinTersimpan);
                if (!sukses) localStorage.removeItem(KEY_BRANGKAS_LOKAL);
            }
        };

        function eksekusiDekripsi(pinAkses) {
            try {
                // Konversi PIN string ke bentuk biner privat murni
                const kunciBiner = CryptoJS.enc.Utf8.parse(pinAkses);
                
                // Eksekusi dekripsi biner murni mode ECB
                const bytes = CryptoJS.AES.decrypt(KONTEN_TERENKRIPSI, kunciBiner, {
                    mode: CryptoJS.mode.ECB,
                    padding: CryptoJS.pad.Pkcs7
                });
                
                let htmlAsli = "";
                try { htmlAsli = bytes.toString(CryptoJS.enc.Utf8); } 
                catch (e) { htmlAsli = bytes.toString(CryptoJS.enc.Latin1); }
                
                if (htmlAsli && htmlAsli.trim().length > 0 && htmlAsli.toLowerCase().includes('admin')) {
                    document.open();
                    document.write(htmlAsli);
                    document.close();
                    return true;
                }
            } catch (e) {
                return false;
            }
            return false;
        }

        function bukaGembokHalaman() {
            const pin = document.getElementById('pinAkses').value.trim();
            const pesanError = document.getElementById('pesanError');
            
            const berhasil = eksekusiDekripsi(pin);
            if (berhasil) {
                localStorage.setItem(KEY_BRANGKAS_LOKAL, pin); // PIN tersimpan privat aman di HP Anda
            } else {
                pesanError.style.display = 'block';
                document.getElementById('pinAkses').value = "";
            }
        }

        document.getElementById('pinAkses').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') bukaGembokHalaman();
