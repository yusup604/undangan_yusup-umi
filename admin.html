        function bukaGembokHalaman() {
            const pin = document.getElementById('pinAkses').value;
            const pesanError = document.getElementById('pesanError');
            
            try {
                // Proses dekripsi matematika instan menggunakan PIN Anda
                const bytes = CryptoJS.AES.decrypt(KONTEN_TERENKRIPSI, pin);
                const htmlAsli = bytes.toString(CryptoJS.enc.Utf8);
                
                // Memastikan hasil dekripsi valid dan memiliki elemen admin-card Anda
                if (htmlAsli.trim().length > 0 && htmlAsli.includes('admin-card')) {
                    // Hancurkan total gatekeeper/form PIN dari memori browser agar bersih
                    document.open();
                    // Inject kode form admin asli Anda yang berhasil dirakit ulang
                    document.write(htmlAsli);
                    document.close();
                } else {
                    pesanError.style.display = 'block';
                    document.getElementById('pinAkses').value = "";
                }
            } catch (e) {
                pesanError.style.display = 'block';
                document.getElementById('pinAkses').value = "";
            }
        }

        // Jalankan fungsi jika menekan tombol Enter pada input PIN
        document.getElementById('pinAkses').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') bukaGembokHalaman();
        });
