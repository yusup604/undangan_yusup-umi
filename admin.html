        // Nama penampung kunci di memori internal browser privat Anda
        const KEY_BRANGKAS_LOKAL = "secure_vault_pin";

        // 🔄 LOGIKA AUTO-LOGIN (AMAN): Mengambil PIN yang tersimpan di HP Anda sendiri
        window.onload = function() {
            const pinTersimpan = localStorage.getItem(KEY_BRANGKAS_LOKAL);
            
            // Jika ada PIN yang pernah tersimpan di HP ini, coba lakukan dekripsi otomatis
            if (pinTersimpan) {
                const sukses = eksekusiDekripsiOtomatis(pinTersimpan);
                // Jika gagal (misal kode enkripsi di GitHub sudah diperbarui), hapus data usang
                if (!sukses) {
                    localStorage.removeItem(KEY_BRANGKAS_LOKAL);
                }
            }
        };

        // Fungsi pemroses dekripsi otomatis menggunakan kunci dari memori internal HP
        function eksekusiDekripsiOtomatis(pinAkses) {
            try {
                const kataSandiHex = CryptoJS.enc.Hex.parse(KONTEN_TERENKRIPSI);
                const formatBase64 = CryptoJS.enc.Base64.stringify(kataSandiHex);
                const bytes = CryptoJS.AES.decrypt(formatBase64, pinAkses);
                
                let htmlAsli = "";
                try { htmlAsli = bytes.toString(CryptoJS.enc.Utf8); } 
                catch (e) { htmlAsli = bytes.toString(CryptoJS.enc.Latin1); }
                
                if (htmlAsli && htmlAsli.trim().length > 0 && htmlAsli.toLowerCase().includes('admin')) {
                    document.open();
                    document.write(htmlAsli);
                    document.close();
                    return true;
                }
            } catch (e) {
                return false;
            }
            return false;
        }

        // Fungsi utama saat Administrator mengetik PIN secara manual pertama kali
        function bukaGembokHalaman() {
            const pinRaw = document.getElementById('pinAkses').value;
            const pin = pinRaw.trim();
            const pesanError = document.getElementById('pesanError');
            
            try {
                const kataSandiHex = CryptoJS.enc.Hex.parse(KONTEN_TERENKRIPSI);
                const formatBase64 = CryptoJS.enc.Base64.stringify(kataSandiHex);
                const bytes = CryptoJS.AES.decrypt(formatBase64, pin);
                
                let htmlAsli = "";
                try { 
                    htmlAsli = bytes.toString(CryptoJS.enc.Utf8); 
                } catch (utfError) { 
                    htmlAsli = bytes.toString(CryptoJS.enc.Latin1); 
                }
                
                // Jika dekripsi berhasil mengekstrak dokumen admin yang valid
                if (htmlAsli && htmlAsli.trim().length > 0 && htmlAsli.toLowerCase().includes('admin')) {
                    
                    // 🎉 SIMPAN PIN SECARA PRIVAT: PIN ditanam di HP Anda sendiri, TIDAK di internet/GitHub
                    localStorage.setItem(KEY_BRANGKAS_LOKAL, pin);
                    
                    document.open();
                    document.write(htmlAsli);
                    document.close();
                } else {
                    pesanError.style.display = 'block';
                    document.getElementById('pinAkses').value = "";
                }
            } catch (e) {
                pesanError.style.display = 'block';
                document.getElementById('pinAkses').value = "";
            }
        }

        // Handler tombol Enter
        document.getElementById('pinAkses').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') bukaGembokHalaman();
