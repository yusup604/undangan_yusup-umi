<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan - Yusup & Umi</title>
    <!-- Font Elegan -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: #f4f1ea; color: #4a4a4a; text-align: center; }
        .wrapper { max-width: 450px; margin: 0 auto; background: #ffffff; min-height: 100vh; padding: 50px 25px; box-shadow: 0 0 25px rgba(0,0,0,0.05); position: relative; }
        
        /* Gaya Judul & Pengantin */
        .title-sub { letter-spacing: 3px; font-size: 0.8rem; color: #8a8a8a; margin-bottom: 10px; }
        h1 { font-family: 'Great Vibes', cursive; font-size: 3.5rem; color: #b89253; margin: 20px 0; }
        h2 { font-family: 'Montserrat', sans-serif; font-weight: 300; font-size: 1.3rem; color: #616161; }
        
        /* Kotak Detail Acara */
        .card { background: #faf8f5; border: 1px solid #eae5d8; padding: 25px 15px; border-radius: 15px; margin: 30px 0; }
        .date { font-size: 1.1rem; font-weight: 600; color: #b89253; margin-bottom: 15px; }
        
        /* Tombol Peta */
        .btn-maps { display: inline-block; padding: 12px 30px; background-color: #b89253; color: white; text-decoration: none; border-radius: 30px; font-weight: 600; font-size: 0.9rem; margin-top: 15px; box-shadow: 0 4px 15px rgba(184, 146, 83, 0.3); transition: 0.3s; }
        .btn-maps:hover { background-color: #9c783e; }
        
        /* Hitung Mundur */
        .countdown-container { display: flex; justify-content: space-around; margin: 25px 0; }
        .countdown-box { background: #b89253; color: white; padding: 10px; border-radius: 10px; min-width: 70px; }
        .countdown-box span { display: block; font-size: 1.5rem; font-weight: 600; }
        .countdown-box label { font-size: 0.7rem; letter-spacing: 1px; }

        /* Tombol Musik Floating */
        .music-control { position: fixed; bottom: 20px; right: 20px; background: #b89253; color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 100; }
    </style>
</head>
<body>

    <div class="wrapper" id="app">
        <!-- Konten diatur otomatis menggunakan JavaScript di bawah -->
        <p>Memuat Undangan...</p>
    </div>

    <!-- Musik Latar Belakang (Ganti URL dengan link lagu instrumen mp3 pilihan Anda jika punya) -->
    <audio id="weddingAudio" loop>
        <source src="https://soundhelix.com" type="audio/mpeg">
    </audio>

    <script>
        // === KONFIGURASI TANGGAL PERNIKAHAN ===
        // Format: TAHUN-BULAN-HARI (Maksimal aktif hingga H+1 tengah malam)
        const targetDate = new Date("2026-12-13T23:59:59"); 

        window.onload = function() {
            const app = document.getElementById("app");
            const now = new Date();

            if (now > targetDate) {
                // Tampilan H+1 otomatis terkunci demi privasi
                app.innerHTML = `
                    <div style="padding: 50px 10px;">
                        <h1 style="font-size: 2.5rem;">Akses Ditutup</h1>
                        <div style="font-size: 4rem; margin: 20px 0;">🔒</div>
                        <p style="line-height: 1.6; color: #666;">Mohon maaf, demi menjaga privasi keluarga besar, halaman undangan serta informasi lokasi rumah telah dinonaktifkan karena seluruh rangkaian acara pernikahan telah selesai.</p>
                        <br>
                        <p style="color: #b89253; font-weight: 600;">Terima kasih atas doa restunya.</p>
                    </div>
                `;
            } else {
                // Tampilan Undangan Utama saat masih aktif
                app.innerHTML = `
                    <p class="title-sub">THE WEDDING OF</p>
                    <h1>Yusup & Umi</h1>
                    <p style="font-style: italic; color: #888; font-size: 0.9rem;">Kepada Yth. Bapak/Ibu/Saudara/i<br>Tamu Undangan Sekalian</p>
                    
                    <div class="card">
                        <p class="date">Minggu, 13 Desember 2026</p>
                        <div class="countdown-container">
                            <div class="countdown-box"><span id="days">00</span><label>HARI</label></div>
                            <div class="countdown-box"><span id="hours">00</span><label>JAM</label></div>
                            <div class="countdown-box"><span id="mins">00</span><label>MENIT</label></div>
                            <div class="countdown-box"><span id="secs">00</span><label>DETIK</label></div>
                        </div>
                    </div>

                    <div class="card" style="background: transparent;">
                        <h2>Informasi Acara</h2>
                        <br>
                        <p><strong>🏠 Lokasi Kediaman:</strong></p>
                        <p style="margin-top: 5px; color: #666;">Silakan isi dengan alamat lengkap rumah Anda di sini</p>
                        
                        <!-- Ganti link di bawah ini dengan tautan Google Maps asli rumah Anda -->
                        <a href="https://google.com" target="_blank" class="btn-maps">
                            📍 Petunjuk Peta Google Maps
                        </a>
                    </div>

                    <p style="font-style: italic; font-size: 0.85rem; color: #8a8a8a; line-height: 1.6; margin-top: 40px;">
                        "Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir untuk memberikan doa restu kepada kami."
                    </p>

                    <!-- Tombol Musik -->
                    <div class="music-control" onclick="toggleMusic()" id="musicBtn">🎵</div>
                `;
                
                // Jalankan fungsi Hitung Mundur
                startCountdown();
            }
        };

        // Fungsi Hitung Mundur (Countdown)
        function startCountdown() {
            const eventDate = new Date("2026-12-13T08:00:00").getTime();
            setInterval(function() {
                const now = new Date().getTime();
                const distance = eventDate - now;
                if (distance < 0) return;

                document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
                document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById("mins").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById("secs").innerText = Math.floor((distance % (1000 * 60)) / 1000);
            }, 1000);
        }

        // Fungsi Musik Play/Pause
        let musicPlaying = false;
        function toggleMusic() {
            const audio = document.getElementById("weddingAudio");
            const btn = document.getElementById("musicBtn");
            if (!musicPlaying) {
                audio.play().catch(e => console.log("Autoplay diblokir browser, butuh interaksi pengguna"));
                btn.innerText = "⏸️";
                musicPlaying = true;
            } else {
                audio.pause();
                btn.innerText = "🎵";
                musicPlaying = false;
            }
        }
    </script>
</body>
</html>
